<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link href="metap/metap.css" rel="stylesheet" />
    <script src="../libs/3rdparty/p5.min.js"></script>
    <script type="module" src="../libs/3rdparty/pixi.mjs"></script>
    <style>
      body {
        margin: 0;
      }
      #pid {
        z-index: 1000;
        width: 20em;
        position: absolute;
        top: 0.2em;
        right: 2em;
        color: yellow;
        font-size: 2vh;
        display: flex;
        column-gap: 2em;
      }
      #logg {
        z-index: 1000;
        width: 20em;
        position: absolute;
        top: 0.2em;
        color: yellow;
        font-size: 2vh;
        display: flex;
        column-gap: 2em;
      }
    </style>
  </head>
  <body>
    <div id="logg">
      <span id="planet-idx"></span>
      <span id="planet-target"></span>
      <span id="planet-distance"></span>
    </div>
    <div id="pid">
      <span style="width: 4em" id="pid-dt"></span>
      <span style="width: 4em" id="pid-p"></span>
      <span style="width: 4em" id="pid-i"></span>
      <span style="width: 4em" id="pid-d"></span>
    </div>
    <input
      type="text"
      id="focus-trap"
      style="opacity: 0; position: absolute; z-index: -1"
    />
  </body>
  <script type="module" src="stardust.js"></script>
</html>
